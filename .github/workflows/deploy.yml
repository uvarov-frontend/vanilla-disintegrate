name: Deploy documentation site

# Manual only: nothing reaches the server without an explicit run. Start it from
# the Actions tab, or with `gh workflow run deploy.yml -f ref=<branch|tag|sha>`.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA to deploy'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: deploy-documentation-site
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  deploy:
    runs-on: ubuntu-latest
    needs: check
    environment:
      name: production
      url: https://disintegrate.uvarov.tech
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Copy repository contents via scp
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          source: '.'
          target: ${{ secrets.TARGET }}
          rm: true

      - name: Build image and restart the container
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          command_timeout: 20m
          script_stop: true
          envs: TARGET
          script: |
            set -euo pipefail

            IMAGE=disintegrate_uvarov_tech
            NAME=disintegrate_uvarov_tech
            PORT=3501

            cd "$TARGET"
            docker build -f deploy/Dockerfile -t "$IMAGE:latest" .

            # Remembered so a failed rollout can be put back on the previous image.
            PREVIOUS=$(docker inspect --format '{{.Image}}' "$NAME" 2>/dev/null || echo '')

            docker rm -f -v "$NAME" 2>/dev/null || true
            docker run -d \
              --name "$NAME" \
              --restart unless-stopped \
              -p "127.0.0.1:$PORT:$PORT" \
              "$IMAGE:latest"

            for attempt in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$PORT/"; then
                echo "Healthy after ${attempt} attempt(s)."
                docker image prune -f >/dev/null
                exit 0
              fi
              sleep 2
            done

            echo 'Health check failed; rolling back.' >&2
            docker logs --tail 50 "$NAME" >&2 || true
            docker rm -f -v "$NAME" 2>/dev/null || true
            if [ -n "$PREVIOUS" ]; then
              docker run -d --name "$NAME" --restart unless-stopped -p "127.0.0.1:$PORT:$PORT" "$PREVIOUS"
              echo 'Rolled back to the previous image.' >&2
            fi
            exit 1
        env:
          TARGET: ${{ secrets.TARGET }}

      - name: Verify the public site
        run: |
          set -euo pipefail
          for path in / /ru/ /docs/learn/installation/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://disintegrate.uvarov.tech${path}")
            echo "${path} -> ${code}"
            [ "$code" = '200' ] || exit 1
          done
