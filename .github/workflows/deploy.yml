name: Deploy documentation site

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA to deploy'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: deploy-documentation-site
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run check

  deploy:
    runs-on: ubuntu-latest
    needs: check
    env:
      DEPLOY_PATH: web/disintegrate.uvarov.tech
      DEPLOY_SHA: ${{ needs.check.outputs.commit }}
    environment:
      name: production
      url: https://disintegrate.uvarov.tech
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.check.outputs.commit }}
          fetch-depth: 1

      - name: Create an immutable source archive
        run: git archive --format=tar.gz --output=deploy-source.tar.gz HEAD

      - name: Upload the source archive
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          source: deploy-source.tar.gz
          target: ${{ env.DEPLOY_PATH }}/incoming

      - name: Build, validate and roll out with rollback
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          command_timeout: 20m
          envs: DEPLOY_PATH,DEPLOY_SHA
          script: |
            set -Eeuo pipefail

            case "$DEPLOY_SHA" in
              *[!0-9a-f]*|'') echo 'Invalid deployment SHA.' >&2; exit 1 ;;
            esac
            [ "${#DEPLOY_SHA}" -eq 40 ] || { echo 'Deployment SHA must contain 40 characters.' >&2; exit 1; }

            IMAGE=disintegrate_uvarov_tech
            NAME=disintegrate_uvarov_tech
            CANDIDATE_NAME=disintegrate_uvarov_tech_candidate
            RELEASE="$DEPLOY_PATH/releases/$DEPLOY_SHA"
            RELEASE_TEMP="${RELEASE}.tmp"
            ARCHIVE="$DEPLOY_PATH/incoming/deploy-source.tar.gz"

            mkdir -p "$DEPLOY_PATH/releases"
            rm -rf "$RELEASE_TEMP"
            mkdir -p "$RELEASE_TEMP"
            tar -xzf "$ARCHIVE" -C "$RELEASE_TEMP"
            rm -f "$ARCHIVE"
            if [ -d "$RELEASE" ]; then
              rm -rf "$RELEASE_TEMP"
            else
              mv "$RELEASE_TEMP" "$RELEASE"
            fi

            docker build -f "$RELEASE/deploy/Dockerfile" -t "$IMAGE:$DEPLOY_SHA" "$RELEASE"
            docker rm -f -v "$CANDIDATE_NAME" 2>/dev/null || true
            docker run -d --name "$CANDIDATE_NAME" -p 127.0.0.1:3502:3501 "$IMAGE:$DEPLOY_SHA"

            for attempt in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:3502/; then
                echo "Candidate healthy after ${attempt} attempt(s)."
                break
              fi
              [ "$attempt" -lt 30 ] || { docker logs --tail 100 "$CANDIDATE_NAME" >&2; exit 1; }
              sleep 2
            done
            docker rm -f -v "$CANDIDATE_NAME"

            PREVIOUS_IMAGE=$(docker inspect --format '{{.Image}}' "$NAME" 2>/dev/null || true)
            rollback() {
              echo 'Rollout failed; restoring the previous container.' >&2
              docker rm -f -v "$NAME" 2>/dev/null || true
              if [ -n "$PREVIOUS_IMAGE" ]; then
                docker run -d --name "$NAME" --restart unless-stopped -p 127.0.0.1:3501:3501 "$PREVIOUS_IMAGE"
              fi
            }
            trap rollback ERR

            docker rm -f -v "$NAME" 2>/dev/null || true
            docker run -d --name "$NAME" --restart unless-stopped -p 127.0.0.1:3501:3501 "$IMAGE:$DEPLOY_SHA"

            for attempt in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:3501/; then
                break
              fi
              [ "$attempt" -lt 30 ] || { docker logs --tail 100 "$NAME" >&2; false; }
              sleep 2
            done
            for path in / /ru/ /docs/learn/installation/; do
              curl -fsS --max-time 20 -o /dev/null "https://disintegrate.uvarov.tech${path}"
            done

            trap - ERR
            docker image prune -f >/dev/null
            echo "Deployed $DEPLOY_SHA successfully."
